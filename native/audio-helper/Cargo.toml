[package]
name = "umastream-audio"
version = "0.2.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.38.4"

# Windows : WASAPI (son par application) + fenêtres réduites
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.27"
# Même version que celle utilisée par wasapi : liste et réouverture des fenêtres réduites
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

# Linux : PulseAudio / PipeWire (la bibliothèque libpulse est présente sur presque tous les bureaux Linux)
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"

# macOS : Core Audio "process taps" (macOS 14.2+), via les liaisons objc2
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSUUID", "NSValue", "NSDictionary"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFArray", "CFDictionary", "CFString", "CFNumber", "CFBase"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3.2", features = ["CoreAudioBaseTypes"] }
block2 = "0.6.2"
